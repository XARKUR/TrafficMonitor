name: GPU selection test build
on:
  push:
    branches: [fix/select-gpu]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, 'Release (lite)']
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: GPU aggregation and selection regression tests
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & .\tests\run-windows-tests.cmd $vs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows application
        shell: pwsh
        run: |
          msbuild TrafficMonitor.sln /t:TrafficMonitor /m /p:Configuration="${{ matrix.configuration }}" /p:Platform=x64 /p:PlatformToolset=v143 /verbosity:minimal /fileLogger /fileLoggerParameters:LogFile=windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package test application
        shell: pwsh
        run: |
          $output = "Bin/x64/${{ matrix.configuration }}"
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item "$output/TrafficMonitor.exe" package/
          Copy-Item "$output/*.dll" package/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse TrafficMonitor/skins package/
          Copy-Item GPU-SELECTION.md package/
      - uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-GPU-select-x64-${{ matrix.configuration }}
          path: package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.configuration }}
          path: windows-build.log
